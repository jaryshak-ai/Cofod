          package auction;

          import cn.nukkit.item.Item;

          import java.util.Base64;
          import java.util.UUID;

          /** Один лот на рынке. Предмет хранится как id/meta/count/NBT (base64). */
          public class Lot {
              public long id;
              public String seller;      // UUID строкой
              public String sellerName;
              public long price;
              public int itemId;
              public int meta;
              public int count;
              public String nbt = "";
              public long created;

              private transient Item cached;

              public static Lot of(long id, UUID seller, String sellerName, long price, Item item) {
                  Lot l = new Lot();
                  l.id = id;
                  l.seller = seller.toString();
                  l.sellerName = sellerName;
                  l.price = price;
                  l.itemId = item.getId();
                  l.meta = item.getDamage();
                  l.count = item.getCount();
                  byte[] tag = item.getCompoundTag();
                  l.nbt = (tag == null || tag.length == 0) ? "" : Base64.getEncoder().encodeToString(tag);
                  l.created = System.currentTimeMillis();
                  return l;
              }

              /** Копия предмета лота (можно менять). */
              public Item toItem() {
                  if (cached == null) {
                      Item item = Item.get(itemId, meta, count);
                      if (nbt != null && !nbt.isEmpty()) {
                          item.setCompoundTag(Base64.getDecoder().decode(nbt));
                      }
                      cached = item;
                  }
                  return cached.clone();
              }
          }
