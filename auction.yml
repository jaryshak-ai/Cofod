          package auction.economy;

          import cn.nukkit.Player;

          /** Мост к плагину монет. Аукцион использует только эти методы (всё по нику). */
          public interface Economy {
              /** Создать аккаунт игроку, если его ещё нет. */
              void ensureAccount(Player p);

              boolean hasAccount(String name);

              long getBalance(String name);

              boolean has(String name, long amount);

              /** Снять монеты. false, если не хватает или нет аккаунта. */
              boolean take(String name, long amount);

              /** Добавить монеты. false, если нет аккаунта или переполнится баланс. */
              boolean add(String name, long amount);

              /** Можно ли начислить столько монет (аккаунт есть и баланс не переполнится). */
              boolean canReceive(String name, long amount);
          }
